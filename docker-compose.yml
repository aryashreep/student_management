services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: student_user
      POSTGRES_PASSWORD: student_password
      POSTGRES_DB: student_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student_user -d student_management"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
